# Builds the AppImage and runs the tests on every push. A pushed v* tag also
# publishes a GitHub release with the AppImage attached.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  QT_VERSION: 6.12.0

jobs:
  appimage:
    # The AppImage runs on systems at least as new as this one (glibc 2.39).
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^VERSION = \([0-9.]*\).*/\1/p' mpv-extended.pro)"
          pkgver="$(sed -n 's/^pkgver=//p' pkgbuild/PKGBUILD)"
          if [ "v$version" != "$GITHUB_REF_NAME" ] || [ "$pkgver" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, mpv-extended.pro $version, PKGBUILD $pkgver: they must agree"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential pkg-config file libmpv-dev ffmpeg wayland-protocols libwayland-dev \
            libgl-dev libegl-dev libxkbcommon-dev libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xkb1 libwayland-cursor0 libwayland-egl1

      # Qt from qt.io: Ubuntu's own Qt 6.4 is too old.
      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v6
        with:
          path: ~/qt
          key: qt-${{ env.QT_VERSION }}-linux_gcc_64

      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: pipx run --spec aqtinstall aqt install-qt -O ~/qt linux desktop "$QT_VERSION" linux_gcc_64

      - name: Put Qt on PATH
        run: echo "$HOME/qt/$QT_VERSION/gcc_64/bin" >> "$GITHUB_PATH"

      - name: Test
        run: bin/test

      - name: Build the AppImage
        run: |
          bin/appimage
          cd dist && sha256sum *.AppImage > "$(ls *.AppImage).sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/*
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run replaces the files of a release that already exists.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "mpv-extended ${GITHUB_REF_NAME#v}" --generate-notes
          fi
